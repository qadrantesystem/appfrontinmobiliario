<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Resultados de Búsqueda - Qadrante</title>

    <!-- Styles base -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pages/search-system.css?v=2">
    <link rel="stylesheet" href="css/components/search-results.css">
    <link rel="stylesheet" href="css/components/search-filters.css">
    <link rel="stylesheet" href="css/components/search-map.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Leaflet para mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- jsPDF y html2canvas para generación de PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="qs-body">

    <!-- Skeleton del módulo de búsqueda (SearchShell pinta los contenedores) -->
    <div id="qsApp" class="qs-app" data-mode="guest">

        <!-- App bar -->
        <header id="qsAppBar" class="qs-appbar"></header>

        <!-- Tabs -->
        <nav id="qsTabs" class="qs-tabs"></nav>

        <!-- Header pills -->
        <div id="qsHeaderPills" class="qs-pills"></div>

        <!-- Barra de filtros + orden -->
        <div id="qsFiltersBar" class="qs-filtersbar"></div>

        <!-- Contador + toggle de vista -->
        <div class="qs-countrow">
            <div id="qsCount" class="qs-count"></div>
            <div id="qsViewToggle" class="qs-viewtoggle"></div>
        </div>

        <!-- Contenido: resultados / mapa -->
        <main class="qs-content">
            <section id="qsResults" class="qs-results qs-view-list"></section>

            <div id="qsMapWrap" class="qs-mapwrap" hidden>
                <div id="qsMap" class="qs-map"></div>
                <div id="qsMapCard" class="qs-mapcard"></div>
            </div>
        </main>

        <!-- Barra de selección -->
        <div id="qsSelectionBar" class="qs-selectionbar" hidden></div>

        <!-- Bottom nav -->
        <nav id="qsBottomNav" class="qs-bottomnav"></nav>

        <!-- Modal de filtros (lo rellena SearchFilters) -->
        <div id="qsFiltersModal" class="qs-modal"></div>
    </div>

    <!-- Scripts del módulo (orden congelado) -->
    <script src="js/config/api.js?v=7"></script>
    <script src="js/services/search.service.js?v=6"></script>
    <script src="js/utils/helpers.js?v=6"></script>
    <script src="js/pages/search-system/search-shell.js"></script>
    <script src="js/pages/search-system/components/search-results.js"></script>
    <script src="js/pages/search-system/components/search-filters.js"></script>
    <script src="js/pages/search-system/components/results-map.js"></script>
    <script src="js/pages/search-system/services/share.service.js"></script>
    <script src="js/pages/search-system/search-main.js"></script>

    <!-- Init -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            window.searchSystem = new SearchSystemMain({ mode: 'guest' });
            await window.searchSystem.init();
        });
    </script>
</body>
</html>
